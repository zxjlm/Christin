[tool.poetry]
name = "christin"
version = "0.1.0"
description = ""
authors = ["harumonia <zxjlm233@gmail.com>"]

[tool.poetry.dependencies]
# Python 3.10+ is required for patched Pillow (>=12.3), cryptography (>=50),
# and setuptools (>=83) releases that close current Dependabot High alerts.
python = ">=3.10,<3.11"
Flask = "^2.2.5"
Flask-Login = "^0.6.2"
Flask-SQLAlchemy = "^2.4.4"
Flask-Migrate = "^2.5.3"
jieba = "^0.42.1"
spacy = "^2.3.5"
loguru = "^0.5.3"
numpy = "^1.21.0"
py2neo = "^2021.2.3"
celery = "^5.2.2"
SQLAlchemy = "^1.3.22"
cymysql = "^0.9.15"
flask-security-too = "^4.1.0"
redis = "^3.5.3"
flask-mail = "^0.9.1"
pandas = "^1.2.2"
xlrd = "^2.0.1"
openpyxl = "^3.0.6"
flask-babel = "^2.0.0"
flasgger = "^0.9.5"
PyQRCode = "^1.2.1"
pycryptodome = "^3.10.1"
bcrypt = "^3.2.0"
docker = "^7.0.0"
chardet = "^5.0.0"
# Security pins (GitHub Dependabot alerts)
Babel = ">=2.9.1"
Mako = ">=1.2.2"
certifi = ">=2022.12.07"
cryptography = ">=50.0.1"
Pillow = ">=12.3.0"
# <82 keeps pkg_resources for flask-security-too 4.x; 78.1.1+ fixes CVE-2025-47273
setuptools = ">=78.1.1,<82"
Werkzeug = ">=2.2.3,<3.0"
requests = ">=2.31.0"
pywin32 = {version = ">=304", markers = "sys_platform == 'win32'"}

[tool.poetry.dev-dependencies]
pytest = "^6.2.1"
flake8 = "^3.8.4"
bandit = "^1.7.0"
pytest-cov = "^2.10.1"
pre-commit = "^2.11.0"
black = "^20.8b1"
# Security pin (via bandit / pre-commit tooling)
GitPython = ">=3.1.49"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
